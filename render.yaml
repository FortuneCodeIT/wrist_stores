services:
  - type: web
    name: wrist-store
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
      python -c "import os; os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'wrist_store.settings'); 
      import django; django.setup(); 
      from django.contrib.auth.models import User; 
      User.objects.create_superuser('admin', 'admin@example.com', 'admin123') 
      if not User.objects.filter(username='admin').exists() else None"
    startCommand: gunicorn wrist_store.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: wrist-store-db
          property: connectionString
    databases:
      - name: wrist-store-db
        databaseName: wrist_store
        user: wrist_store_user